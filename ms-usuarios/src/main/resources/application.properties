spring.application.name=ms-usuarios
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/induztek_usuarios?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=induztek_app
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.error.include-message=always

roles.service.url=http://localhost:8081
server.forward-headers-strategy=framework
app.avatares.carpeta=uploads/avatares
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.config.import=optional:classpath:application-local.properties
